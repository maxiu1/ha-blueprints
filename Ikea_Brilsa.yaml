blueprint:
  name: IKEA Symfonisk Wheel (ZHA) - Manual IEEE
  description: Control lights using the Wheel's IEEE address (found in Device Info).
  domain: automation
  input:
    remote_ieee:
      name: Wheel IEEE Address
      description: "Paste the Zigbee IEEE address here (e.g., 10:35:97:00:00:12:e4:2c)."
      selector:
        text:
    target_light:
      name: Light to Toggle & Dim
      description: The main light for clicking and scrolling.
      selector:
        target:
          entity:
            domain: light
    double_click_entity:
      name: Double Click Action
      description: Entity to toggle when you click twice fast (On-On).
      default: []
      selector:
        target:

mode: restart

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      # We force the trigger to only care about your specific wheel's MAC
      device_ieee: !input remote_ieee

action:
  - choose:
      # SCROLLING
      - conditions:
          - "{{ trigger.event.data.command == 'move_to_level' }}"
        sequence:
          - service: light.turn_on
            target: !input target_light
            data:
              brightness: "{{ trigger.event.data.args[0] }}"

      # SINGLE CLICK
      - conditions:
          - "{{ trigger.event.data.command == 'on' }}"
        sequence:
          - service: light.toggle
            target: !input target_light

      # DOUBLE CLICK
      - conditions:
          - "{{ trigger.event.data.command == 'on_on' or trigger.event.data.command == 'step' }}"
        sequence:
          - service: homeassistant.toggle
            target: !input double_click_entity
