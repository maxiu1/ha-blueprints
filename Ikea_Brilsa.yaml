blueprint:
  name: IKEA Symfonisk Wheel (ZHA) - With Double Click
  description: Adds double-click logic to the IKEA Gen 1 Wheel.
  domain: automation
  input:
    remote_ieee:
      name: Wheel IEEE Address
      description: "Paste the IEEE address (e.g., 10:35:97:00:00:12:e4:2c)."
      selector:
        text:
    target_light:
      name: Main Light (Single Click & Scroll)
      selector:
        target:
          entity:
            domain: light
    double_click_entity:
      name: Double Click Action
      description: Entity to toggle when you click twice fast.
      default: []
      selector:
        target:

mode: restart # Important: Restart allows the timer to be 'interrupted' by the second click

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_ieee: !input remote_ieee

action:
  - choose:
      # SCROLLING (Dimming)
      - conditions:
          - "{{ trigger.event.data.command == 'move_to_level' }}"
        sequence:
          - service: light.turn_on
            target: !input target_light
            data:
              brightness: "{{ trigger.event.data.args[0] }}"

      # BUTTON PRESS (The logic for Single vs Double)
      - conditions:
          - "{{ trigger.event.data.command == 'on' }}"
        sequence:
          - wait_for_trigger:
              - platform: event
                event_type: zha_event
                event_data:
                  device_ieee: !input remote_ieee
                  command: "on"
            timeout: "00:00:00.400" # Window for the second click
            continue_on_timeout: true
          
          - if:
              - "{{ wait.trigger == none }}" # No second click happened
            then:
              - service: light.toggle
                target: !input target_light
            else: # Second click WAS detected
              - service: homeassistant.toggle
                target: !input double_click_entity
