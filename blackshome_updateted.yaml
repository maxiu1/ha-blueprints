blueprint:
  name: Sensor Light (Motion + Optional Lux/Sun + Wireless Charger Type)
  description: >
    Turns lights on by motion and/or by "wireless charger type" sensor (e.g. sensor.s24u_charger_type == wireless).
    Optional illuminance & sun elevation conditions.
    Turns lights off after no motion AND not wireless for configured time.
  domain: automation

  input:
    motion_sensor:
      name: Motion Sensor
      selector:
        entity:
          domain: binary_sensor

    light_target:
      name: Light
      selector:
        target:
          entity:
            domain: light

    no_motion_wait:
      name: Wait time after no motion AND not wireless (seconds)
      default: 120
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: seconds

    illuminance_sensor:
      name: (Optional) Illuminance Sensor
      default: ""
      selector:
        entity:
          domain: sensor
          device_class: illuminance

    illuminance_threshold:
      name: Illuminance Threshold
      default: 20
      selector:
        number:
          min: 0
          max: 10000

    sun_elevation:
      name: (Optional) Sun Elevation Max
      description: Only turn lights on if sun is below this elevation
      default: 5
      selector:
        number:
          min: -10
          max: 90

    charger_type_sensor:
      name: (Optional) Charger type sensor
      description: >
        Entity like sensor.s24u_charger_type with values: ac/usb/wireless/dock/none
      default: ""
      selector:
        entity:
          domain: sensor

    wireless_value:
      name: Charger type value for wireless
      default: wireless
      selector:
        text: {}

    charger_ignores_lux:
      name: Wireless charging ignores lux/sun conditions
      default: true
      selector:
        boolean: {}

mode: restart

variables:
  motion_sensor: !input motion_sensor
  light_target: !input light_target
  no_motion_wait: !input no_motion_wait
  illuminance_sensor: !input illuminance_sensor
  illuminance_threshold: !input illuminance_threshold
  sun_elevation: !input sun_elevation
  charger_type_sensor: !input charger_type_sensor
  wireless_value: !input wireless_value
  charger_ignores_lux: !input charger_ignores_lux

trigger:
  # Motion starts -> ON evaluation
  - id: motion_on
    platform: state
    entity_id: !input motion_sensor
    to: "on"

  # Motion ended for X seconds -> OFF evaluation (only if not wireless too)
  - id: motion_off_wait
    platform: state
    entity_id: !input motion_sensor
    to: "off"
    for:
      seconds: !input no_motion_wait

  # Charger becomes wireless -> ON evaluation
  - id: wireless_on
    platform: state
    entity_id: !input charger_type_sensor
    to: !input wireless_value

  # "Not wireless" for X seconds -> OFF evaluation (only if motion also off)
  # Use template trigger so we can do "not equal wireless" cleanly.
  - id: wireless_off_wait
    platform: template
    value_template: >
      {{ charger_type_sensor != '' and states(charger_type_sensor) != wireless_value }}
    for:
      seconds: !input no_motion_wait

condition: []

action:
  - variables:
      motion_on: "{{ is_state(motion_sensor, 'on') }}"

      wireless_now: >-
        {% if charger_type_sensor == '' %}
          false
        {% else %}
          {{ is_state(charger_type_sensor, wireless_value) }}
        {% endif %}

      lux_ok: >-
        {% if illuminance_sensor == '' %}
          true
        {% else %}
          {{ states(illuminance_sensor) | float(999999) < (illuminance_threshold | float(0)) }}
        {% endif %}

      sun_ok: "{{ state_attr('sun.sun','elevation') | float(999999) < (sun_elevation | float(0)) }}"

      env_ok: "{{ lux_ok or sun_ok }}"

      should_turn_on: >-
        {% if wireless_now and charger_ignores_lux %}
          true
        {% else %}
          {{ (motion_on or wireless_now) and env_ok }}
        {% endif %}

      should_turn_off: "{{ (not motion_on) and (not wireless_now) }}"

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ should_turn_on }}"
        sequence:
          - service: light.turn_on
            target: !input light_target

    default:
      # Only turn off when BOTH are inactive (no motion + not wireless)
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ should_turn_off }}"
            sequence:
              - service: light.turn_off
                target: !input light_target