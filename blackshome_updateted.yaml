blueprint:
  name: Sensor Light + Wireless Charger Type
  description: >
    Motion-based light automation with optional illuminance/sun checks,
    plus optional Wireless Charging trigger using a "charger type" sensor
    (e.g. sensor.s24u_charger_type == wireless).
  domain: automation

  input:
    motion_sensor:
      name: Motion Sensor
      selector:
        entity:
          domain: binary_sensor

    light_target:
      name: Light
      selector:
        target:
          entity:
            domain: light

    no_motion_wait:
      name: Wait time after no motion / no wireless (seconds)
      default: 120
      selector:
        number:
          min: 1
          max: 3600
          unit_of_measurement: seconds

    illuminance_sensor:
      name: (Optional) Illuminance Sensor
      default: []
      selector:
        entity:
          domain: sensor
          device_class: illuminance

    illuminance_threshold:
      name: Illuminance Threshold
      default: 20
      selector:
        number:
          min: 0
          max: 1000

    sun_elevation:
      name: (Optional) Sun Elevation Max
      description: Only turn lights on if sun is below this elevation
      default: 5
      selector:
        number:
          min: -10
          max: 90

    charger_type_sensor:
      name: (Optional) Phone Charger Type Sensor
      description: >
        Sensor that reports charger type (e.g. ac / usb / wireless / dock / none).
        Example: sensor.s24u_charger_type
      default: []
      selector:
        entity:
          domain: sensor

    wireless_value:
      name: Charger type value for wireless
      description: Usually "wireless"
      default: "wireless"
      selector:
        text: {}

    charger_ignores_lux:
      name: Wireless trigger ignores lux/sun conditions
      description: If enabled, wireless charging can turn lights on regardless of lux/sun.
      default: true
      selector:
        boolean: {}

mode: restart

trigger:
  # Motion ON
  - platform: state
    entity_id: !input motion_sensor
    to: "on"

  # Motion OFF for X seconds (we'll decide in action whether to turn off)
  - platform: state
    entity_id: !input motion_sensor
    to: "off"
    for:
      seconds: !input no_motion_wait

  # Charger type becomes wireless
  - platform: state
    entity_id: !input charger_type_sensor
    to: !input wireless_value

  # Charger type becomes not-wireless for X seconds
  - platform: state
    entity_id: !input charger_type_sensor
    from: !input wireless_value
    for:
      seconds: !input no_motion_wait

condition: []

action:
  - variables:
      motion_on: "{{ is_state((!input motion_sensor), 'on') }}"
      has_charger_type: "{{ (!input charger_type_sensor) != [] }}"
      wireless_now: >-
        {% if (!input charger_type_sensor) == [] %}
          false
        {% else %}
          {{ is_state((!input charger_type_sensor), (!input wireless_value)) }}
        {% endif %}
      lux_ok: >-
        {% if (!input illuminance_sensor) == [] %}
          true
        {% else %}
          {{ states((!input illuminance_sensor))|float(999999) < (!input illuminance_threshold)|float(0) }}
        {% endif %}
      sun_ok: "{{ state_attr('sun.sun','elevation')|float(999999) < (!input sun_elevation)|float(0) }}"
      env_ok: "{{ lux_ok or sun_ok }}"
      should_turn_on: >-
        {% if wireless_now and is_state((!input charger_ignores_lux)|string, 'True') %}
          true
        {% else %}
          {{ (motion_on or wireless_now) and env_ok }}
        {% endif %}
      should_turn_off: "{{ (not motion_on) and (not wireless_now) }}"

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ should_turn_on }}"
        sequence:
          - service: light.turn_on
            target: !input light_target

    default:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ should_turn_off }}"
            sequence:
              - service: light.turn_off
                target: !input light_target