blueprint:
  name: "Brilsa Wheel - Pancerny Fix"
  description: "Obsługuje specyficzny payload Brilsa: on/off oraz action_level"
  domain: automation
  input:
    remote_entity:
      name: Brilsa Action Sensor
      selector:
        entity:
          domain: sensor
    light_target:
      name: Światła Salon
      selector:
        target:
          entity:
            domain: light
    switch_target:
      name: Krzak
      selector:
        target:
          entity:
            domain: switch

mode: restart

trigger:
  - platform: state
    entity_id: !input remote_entity

action:
  - variables:
      # Pobieramy stan i atrybut
      current_action: "{{ trigger.to_state.state }}"
      current_level: "{{ state_attr(trigger.entity_id, 'action_level') }}"

  - choose:
      # 1. KLIKNIĘCIE (on / off)
      - conditions:
          - condition: template
            value_template: "{{ current_action in ['on', 'off', 'toggle'] }}"
        sequence:
          - service: light.toggle
            target: !input light_target

      # 2. PODWÓJNE KLIKNIĘCIE (on_double / off_double)
      - conditions:
          - condition: template
            value_template: "{{ current_action in ['on_double', 'off_double'] }}"
        sequence:
          - service: switch.toggle
            target: !input switch_target

      # 3. JASNOŚĆ - Reagujemy zawsze, gdy action_level jest liczbą
      # Ignorujemy, gdy jest to 'null', puste lub nieobecne
      - conditions:
          - condition: template
            value_template: "{{ current_level is not none and current_level | is_number }}"
        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness: "{{ current_level | int }}"

