blueprint:
  name: Universal Wheel + Optional Temp TTS
  description: Control Lights, Media, and get Temperature updates.
  domain: automation
  input:
    remote_trigger:
      name: Remote Action Sensor
      description: The sensor reporting "rotate_left", "rotate_right", "click", or "double_click".
      selector:
        entity:
          domain: sensor
    light_target:
      name: Light (Optional)
      default: {}
      selector:
        target:
          entity:
            domain: light
    media_target:
      name: Media Player (Optional)
      default: {}
      selector:
        target:
          entity:
            domain: media_player
    temp_sensor:
      name: Temperature Sensor (Optional)
      description: The Zigbee sensor to read for the TTS announcement.
      default: 
      selector:
        entity:
          domain: sensor
          device_class: temperature

mode: restart

trigger:
  - platform: state
    entity_id: !input remote_trigger

action:
  - choose:
      # ROTATE RIGHT: Brightness +10% / Volume +5%
      - conditions:
          - condition: template
            value_template: "{{ 'right' in trigger.to_state.state or 'up' in trigger.to_state.state }}"
        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness_step_pct: 10
          - service: media_player.volume_set
            target: !input media_target
            data:
              volume_level: "{{ (state_attr(trigger.to_state.entity_id, 'volume_level') | float(0.5)) + 0.05 }}"

      # ROTATE LEFT: Brightness -10% / Volume -5%
      - conditions:
          - condition: template
            value_template: "{{ 'left' in trigger.to_state.state or 'down' in trigger.to_state.state }}"
        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness_step_pct: -10
          - service: media_player.volume_set
            target: !input media_target
            data:
              volume_level: "{{ (state_attr(trigger.to_state.entity_id, 'volume_level') | float(0.5)) - 0.05 }}"

      # SINGLE CLICK: Toggle Power / Play-Pause
      - conditions:
          - condition: template
            value_template: "{{ 'toggle' in trigger.to_state.state or 'click' in trigger.to_state.state and 'double' not in trigger.to_state.state }}"
        sequence:
          - service: homeassistant.toggle
            target: !input light_target
          - service: media_player.media_play_pause
            target: !input media_target

      # DOUBLE CLICK: TTS Temperature (Optional)
      - conditions:
          - condition: template
            value_template: "{{ 'double' in trigger.to_state.state }}"
        sequence:
          - condition: template
            value_template: "{{ temp_sensor != none }}"
          - service: tts.google_say
            target: !input media_target
            data:
              message: "The current temperature is {{ states(temp_sensor) }} degrees."
