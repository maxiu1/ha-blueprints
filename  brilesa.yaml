blueprint:
  name: "Brilesa Wheel: Portable & Bug-Free"
  description: "1-Click On/Off, Double-Click Individual, Wheel 0-255 Brightness."
  domain: automation
  input:
    mqtt_topic:
      name: MQTT Topic
      description: The base topic of your wheel (e.g., zigbee2mqtt/Wheel1).
      default: zigbee2mqtt/Wheel1
    main_lights:
      name: Main Lights (Group)
      description: These turn on/off with single clicks and react to the wheel.
      selector:
        target:
          entity:
            domain: light
    individual_light:
      name: Individual Light (Double-Click)
      description: This specific entity toggles when you double-click.
      selector:
        target:
          entity:
            domain: light

mode: restart

trigger:
  - platform: mqtt
    topic: !input mqtt_topic

action:
  - variables:
      payload: "{{ trigger.payload_json }}"
      action_state: "{{ payload.action }}"
      lvl: "{{ payload.action_level | float(0) }}"

  - choose:
      # 1. WHEEL SCROLL: Absolute Brightness 0-255
      - conditions:
          - condition: template
            value_template: "{{ action_state == 'brightness_move_to_level' }}"
        sequence:
          - service: light.turn_on
            target: !input main_lights
            data:
              brightness: "{{ lvl }}"

      # 2. SINGLE CLICK ON: Turn all main lights on
      - conditions:
          - condition: template
            value_template: "{{ action_state == 'on' }}"
        sequence:
          - service: light.turn_on
            target: !input main_lights

      # 3. SINGLE CLICK OFF: Turn all main lights off
      - conditions:
          - condition: template
            value_template: "{{ action_state == 'off' }}"
        sequence:
          - service: light.turn_off
            target: !input main_lights

      # 4. DOUBLE CLICK (on_on): Toggle the individual light
      - conditions:
          - condition: template
            value_template: "{{ action_state in ['double', 'on_on'] }}"
        sequence:
          - service: light.toggle
            target: !input individual_light
