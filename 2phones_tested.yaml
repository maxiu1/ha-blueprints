blueprint:
  name: Phone Wireless Charging Lights (Dim + Optional OFF + Morning Alarm) [PRO]
  description: >
    Immediately dim lights when phone starts wireless charging (wireless only).
    Supports optional second phone.
    Optional auto OFF after dim (no external timer helper needed).
    Scheduled ON on selected weekdays with enable switch and master disable.
  domain: automation

  input:
    phone1_charging:
      name: Phone 1 – Charging sensor
      selector:
        entity:
          domain: binary_sensor

    phone1_charger_type:
      name: Phone 1 – Charger type sensor
      description: Must return "wireless" when on a wireless charger
      selector:
        entity:
          domain: sensor

    use_second_phone:
      name: Use second phone
      default: false
      selector:
        boolean: {}

    phone2_charging:
      name: Phone 2 – Charging sensor
      default: []
      selector:
        entity:
          domain: binary_sensor

    phone2_charger_type:
      name: Phone 2 – Charger type sensor
      description: Must return "wireless" when on a wireless charger
      default: []
      selector:
        entity:
          domain: sensor

    dim_lights:
      name: Lights to dim when charging
      selector:
        target:
          entity:
            domain: light

    dim_brightness:
      name: Dim brightness (%)
      default: 10
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    dim_transition:
      name: Dim transition (seconds)
      default: 2
      selector:
        number:
          min: 0
          max: 30
          unit_of_measurement: s

    enable_auto_off:
      name: Enable auto OFF after dim
      default: false
      selector:
        boolean: {}

    auto_off_minutes:
      name: Auto OFF after dim (minutes)
      default: 10
      selector:
        number:
          min: 1
          max: 240
          unit_of_measurement: min

    on_time:
      name: Time to turn lights ON
      selector:
        time: {}

    weekdays:
      name: Active weekdays
      selector:
        select:
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
          multiple: true

    on_lights:
      name: Lights to turn ON
      selector:
        target:
          entity:
            domain: light

    on_brightness:
      name: ON brightness (%)
      default: 80
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    on_transition:
      name: ON transition (seconds)
      default: 2
      selector:
        number:
          min: 0
          max: 30
          unit_of_measurement: s

    enable_morning_alarm:
      name: Enable morning alarm lights
      default: true
      selector:
        boolean: {}

    morning_allow_switch:
      name: Morning lights master switch
      description: Disable this if you DON'T want lights to turn on in the morning
      default: true
      selector:
        boolean: {}

mode: restart
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input phone1_charging
    to: "on"
    for: "00:00:03"
    id: phone1_charge

  - platform: state
    entity_id: !input phone2_charging
    to: "on"
    for: "00:00:03"
    id: phone2_charge

  - platform: time
    at: !input on_time
    id: scheduled_on

action:
  - variables:
      use_second: !input use_second_phone
      auto_off_enabled: !input enable_auto_off
      morning_enabled: !input enable_morning_alarm
      morning_allowed: !input morning_allow_switch
      days: !input weekdays

  - choose:

      # ───────── DIM ON WIRELESS CHARGING ─────────
      - conditions:
          - condition: or
            conditions:

              - condition: and
                conditions:
                  - condition: trigger
                    id: phone1_charge
                  - condition: state
                    entity_id: !input phone1_charger_type
                    state: "wireless"

              - condition: and
                conditions:
                  - condition: trigger
                    id: phone2_charge
                  - condition: template
                    value_template: "{{ use_second }}"
                  - condition: state
                    entity_id: !input phone2_charger_type
                    state: "wireless"

        sequence:
          - service: light.turn_on
            target: !input dim_lights
            data:
              brightness_pct: !input dim_brightness
              transition: !input dim_transition

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ auto_off_enabled }}"
                sequence:
                  - delay:
                      minutes: !input auto_off_minutes
                  - service: light.turn_off
                    target: !input dim_lights
                    data:
                      transition: !input dim_transition

      # ───────── SCHEDULED MORNING ON ─────────
      - conditions:
          - condition: trigger
            id: scheduled_on
          - condition: template
            value_template: "{{ morning_enabled and morning_allowed }}"
          - condition: template
            value_template: "{{ now().strftime('%A')|lower in days }}"

        sequence:
          - service: light.turn_on
            target: !input on_lights
            data:
              brightness_pct: !input on_brightness
              transition: !input on_transition