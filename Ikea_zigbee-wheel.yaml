blueprint:
  name: IKEA STYRBAR (706.041.72) Advanced Controller
  description: Control lights using single, double, long presses, and the side buttons for brightness.
  domain: automation
  input:
    remote:
      name: IKEA STYRBAR Remote
      description: Select the sensor/action entity from Zigbee2MQTT (e.g., sensor.remote_action)
      selector:
        entity:
          domain: sensor
    light_target:
      name: Light(s)
      description: The light(s) to control.
      selector:
        target:
          entity:
            domain: light

mode: restart
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input remote

action:
  - vars:
      action: "{{ trigger.to_state.state }}"
  - choose:
      # --- TOP BUTTON: Power/Brighten ---
      - conditions: "{{ action == 'on' }}"
        sequence:
          - service: light.toggle
            target: !input light_target

      # --- BOTTOM BUTTON: Off/Darken ---
      - conditions: "{{ action == 'off' }}"
        sequence:
          - service: light.turn_off
            target: !input light_target

      # --- RIGHT BUTTON: Increase (Wheel Simulation) ---
      - conditions: "{{ action == 'arrow_right_click' }}"
        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness_step_pct: 10

      # --- LEFT BUTTON: Decrease (Wheel Simulation) ---
      - conditions: "{{ action == 'arrow_left_click' }}"
        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness_step_pct: -10

      # --- LONG PRESS RIGHT (Smooth Dimming Up) ---
      - conditions: "{{ action == 'arrow_right_hold' }}"
        sequence:
          - repeat:
              while:
                - condition: template
                  value_template: "{{ wait.trigger.to_state.state != 'arrow_right_release' }}"
              sequence:
                - service: light.turn_on
                  target: !input light_target
                  data:
                    brightness_step_pct: 10
                    transition: 0.5
                - delay: 0.5
              until:
                - condition: template
                  value_template: "{{ trigger.to_state.state == 'arrow_right_release' }}"

      # --- LONG PRESS LEFT (Smooth Dimming Down) ---
      - conditions: "{{ action == 'arrow_left_hold' }}"
        sequence:
          - repeat:
              while:
                - condition: template
                  value_template: "{{ wait.trigger.to_state.state != 'arrow_left_release' }}"
              sequence:
                - service: light.turn_on
                  target: !input light_target
                  data:
                    brightness_step_pct: -10
                    transition: 0.5
                - delay: 0.5
