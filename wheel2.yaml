blueprint:
  name: "Brilsa Wheel - Uniwersalny FIX"
  description: "Działa na on/off oraz jasność. Switch jest opcjonalny i nie sypie błędami."
  domain: automation
  input:
    remote_entity:
      name: Brilsa Action Sensor
      selector:
        entity:
          domain: sensor
    light_target:
      name: Światło (Pojedyncze kliknięcie i obrót)
      selector:
        target:
          entity:
            domain: light
    switch_target:
      name: Dodatkowy Switch (Podwójne kliknięcie - OPCJONALNIE)
      default: {} # Zmieniono z [] na {} dla poprawnej walidacji słownika
      selector:
        target:
          entity:
            domain: switch

mode: restart

trigger:
  - platform: state
    entity_id: !input remote_entity

action:
  - variables:
      current_action: "{{ trigger.to_state.state }}"
      current_level: "{{ state_attr(trigger.entity_id, 'action_level') }}"
      # Sprawdzamy, czy wybrano jakikolwiek podmiot dla switcha
      switch_selected: !input switch_target

  - choose:
      # 1. POJEDYNCZE KLIKNIĘCIE
      - conditions:
          - condition: template
            value_template: "{{ current_action in ['on', 'off', 'toggle'] }}"
        sequence:
          - service: light.toggle
            target: !input light_target

      # 2. PODWÓJNE KLIKNIĘCIE
      - conditions:
          - condition: template
            value_template: "{{ current_action in ['on_double', 'off_double'] }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ switch_selected != {} and switch_selected != none }}"
                sequence:
                  - service: switch.toggle
                    target: !input switch_target

      # 3. OBRÓT KOŁEM
      - conditions:
          - condition: template
            value_template: "{{ current_level is not none and current_level | is_number }}"
        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness: "{{ current_level | int }}"
