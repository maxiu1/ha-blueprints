blueprint:
  name: Z2M Direct MQTT Wheel (Polish TTS)
  description: Direct MQTT version - bypasses missing HA sensors.
  domain: automation
  input:
    wheel_name:
      name: Zigbee2MQTT Friendly Name
      description: The name of your wheel in Z2M (e.g., Wheel1).
      default: Wheel1
    light_target:
      name: Light (Optional)
      default: {}
      selector:
        target:
          entity:
            domain: light
    media_player:
      name: Media Player (Optional)
      default: {}
      selector:
        target:
          entity:
            domain: media_player
    temp_sensor:
      name: Temperature Sensor (Optional)
      default: 
      selector:
        entity:
          domain: sensor
          device_class: temperature

mode: restart

trigger:
  - platform: mqtt
    # This listens to the raw data from Zigbee2MQTT
    topic: "zigbee2mqtt/{{ wheel_name }}"

action:
  - variables:
      # Parse the JSON payload coming from MQTT
      payload: "{{ trigger.payload_json }}"
      action_state: "{{ payload.action }}"
      # Extract level (0-255)
      lvl: "{{ payload.action_level | float(0) }}"
      # Convert for Volume (0.0-1.0)
      vol: "{{ (lvl / 255) | round(2) }}"

  - choose:
      # ROTATION
      - conditions:
          - condition: template
            value_template: "{{ action_state == 'brightness_move_to_level' }}"
        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness: "{{ lvl }}"
          - service: media_player.volume_set
            target: !input media_player
            data:
              volume_level: "{{ vol }}"

      # SINGLE CLICK
      - conditions:
          - condition: template
            value_template: "{{ action_state in ['toggle', 'single', 'on'] }}"
        sequence:
          - service: homeassistant.toggle
            target: !input light_target
          - service: media_player.media_play_pause
            target: !input media_player

      # DOUBLE CLICK (Polish TTS)
      - conditions:
          - condition: template
            value_template: "{{ action_state == 'double' }}"
        sequence:
          - condition: template
            value_template: "{{ temp_sensor != none }}"
          - service: tts.google_translate_say
            target: !input media_player
            data:
              language: "pl"
              message: "Temperatura wynosi {{ states(temp_sensor) | replace('.', ',') }} stopni."
