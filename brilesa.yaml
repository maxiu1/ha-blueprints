blueprint:
  name: Z2M Universal Wheel Controller
  description: Optimized for Zigbee2MQTT rotary encoders (IKEA, Tuya, etc.)
  domain: automation
  input:
    remote_sensor:
      name: Remote Action Sensor
      description: The "action" entity from Zigbee2MQTT (e.g., sensor.my_wheel_action)
      selector:
        entity:
          domain: sensor
    light_target:
      name: Light (Optional)
      default: {}
      selector:
        target:
          entity:
            domain: light
    media_target:
      name: Media Player (Optional)
      default: {}
      selector:
        target:
          entity:
            domain: media_player
    temp_sensor:
      name: Temperature Sensor (Optional)
      default: 
      selector:
        entity:
          domain: sensor
          device_class: temperature

mode: restart
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input remote_sensor

action:
  - variables:
      # Capture the action string from Z2M
      action: "{{ trigger.to_state.state }}"

  - choose:
      # ROTATE RIGHT
      - conditions:
          - condition: template
            value_template: "{{ action in ['rotate_right', 'brightness_move_up', 'volume_up'] }}"
        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness_step_pct: 10
          - service: media_player.volume_set
            target: !input media_target
            data:
              volume_level: "{{ (state_attr(trigger.to_state.entity_id, 'volume_level') | float(0.5)) + 0.05 }}"

      # ROTATE LEFT
      - conditions:
          - condition: template
            value_template: "{{ action in ['rotate_left', 'brightness_move_down', 'volume_down'] }}"
        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness_step_pct: -10
          - service: media_player.volume_set
            target: !input media_target
            data:
              volume_level: "{{ (state_attr(trigger.to_state.entity_id, 'volume_level') | float(0.5)) - 0.05 }}"

      # SINGLE CLICK
      - conditions:
          - condition: template
            value_template: "{{ action in ['toggle', 'on', 'off', 'single'] }}"
        sequence:
          - service: homeassistant.toggle
            target: !input light_target
          - service: media_player.media_play_pause
            target: !input media_target

      # DOUBLE CLICK (TTS Temperature)
      - conditions:
          - condition: template
            value_template: "{{ action in ['double', 'brightness_stop'] }}" # Some wheels use 'stop' as a second action
        sequence:
          - condition: template
            value_template: "{{ temp_sensor != none }}"
          - service: tts.google_say
            target: !input media_target
            data:
              message: "The current temperature is {{ states(temp_sensor) }} degrees."
