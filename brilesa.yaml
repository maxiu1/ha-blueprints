blueprint:
  name: Z2M Polish Wheel Final
  description: Syncs Wheel1 rotation and speaks temperature in Polish.
  domain: automation
  input:
    remote_sensor:
      name: Wheel Action Sensor
      description: Look for sensor.wheel1_action (now visible thanks to legacy settings).
      selector:
        entity:
          domain: sensor
    light_target:
      name: Light (Optional)
      default: {}
      selector:
        target:
          entity:
            domain: light
    media_player:
      name: Media Player (Optional)
      default: {}
      selector:
        target:
          entity:
            domain: media_player
    temp_sensor:
      name: Temperature Sensor (Optional)
      default: 
      selector:
        entity:
          domain: sensor
          device_class: temperature

mode: restart

trigger:
  - platform: state
    entity_id: !input remote_sensor

action:
  - variables:
      # Extract level from attributes
      lvl: "{{ state_attr(trigger.entity_id, 'action_level') | float(0) }}"
      # Convert 0-255 to 0.0-1.0
      vol: "{{ (lvl / 255) | round(2) }}"
      action_state: "{{ trigger.to_state.state }}"

  - choose:
      # ROTATION
      - conditions:
          - condition: template
            value_template: "{{ action_state == 'brightness_move_to_level' }}"
        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness: "{{ lvl }}"
          - service: media_player.volume_set
            target: !input media_player
            data:
              volume_level: "{{ vol }}"

      # SINGLE CLICK
      - conditions:
          - condition: template
            value_template: "{{ action_state in ['toggle', 'single', 'on'] }}"
        sequence:
          - service: homeassistant.toggle
            target: !input light_target
          - service: media_player.media_play_pause
            target: !input media_player

      # DOUBLE CLICK
      - conditions:
          - condition: template
            value_template: "{{ action_state == 'double' }}"
        sequence:
          - condition: template
            value_template: "{{ temp_sensor != none }}"
          - service: tts.google_translate_say
            target: !input media_player
            data:
              language: "pl"
              message: "Temperatura wynosi {{ states(temp_sensor) | replace('.', ',') }} stopni."
