blueprint:
  name: Z2M Wheel (MQTT Device Picker)
  description: Professional rotation sync using the Device Picker for MQTT.
  domain: automation
  input:
    wheel_device:
      name: Wheel Device
      description: Select your Zigbee2MQTT Wheel device.
      selector:
        device:
          integration: mqtt
    light_target:
      name: Light (Optional)
      default: {}
      selector:
        target:
          entity:
            domain: light
    media_player:
      name: Media Player (Optional)
      default: {}
      selector:
        target:
          entity:
            domain: media_player
    temp_sensor:
      name: Temperature Sensor (Optional)
      default: 
      selector:
        entity:
          domain: sensor
          device_class: temperature

mode: restart

# This dynamic trigger listens to any MQTT message from the selected device
trigger:
  - platform: device
    domain: mqtt
    device_id: !input wheel_device
    type: action # This catches the 'action' sub-event from Z2M

action:
  - variables:
      # Extracting data from the trigger payload
      action_state: "{{ trigger.payload }}"
      # In some Z2M setups, level comes in a different field. 
      # We check 'action_level' first, then 'brightness' as a backup.
      lvl: "{{ trigger.payload_json.action_level | default(trigger.payload_json.brightness) | float(0) }}"
      vol: "{{ (lvl / 255) | round(2) }}"

  - choose:
      # ROTATION: Sync level to Light/Media
      - conditions:
          - condition: template
            value_template: "{{ action_state == 'brightness_move_to_level' }}"
        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness: "{{ lvl }}"
          - service: media_player.volume_set
            target: !input media_player
            data:
              volume_level: "{{ vol }}"

      # SINGLE CLICK: Toggle
      - conditions:
          - condition: template
            value_template: "{{ action_state in ['toggle', 'single', 'on'] }}"
        sequence:
          - service: homeassistant.toggle
            target: !input light_target
          - service: media_player.media_play_pause
            target: !input media_player

      # DOUBLE CLICK: Polish TTS
      - conditions:
          - condition: template
            value_template: "{{ action_state == 'double' }}"
        sequence:
          - condition: template
            value_template: "{{ temp_sensor != none }}"
          - service: tts.google_translate_say
            target: !input media_player
            data:
              language: "pl"
              message: "Temperatura wynosi {{ states(temp_sensor) | replace('.', ',') }} stopni."
