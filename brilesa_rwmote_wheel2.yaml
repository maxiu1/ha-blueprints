blueprint:
  name: "Brilesa Wheel: Device-Based (Scenes & Double-Tap)"
  description: "1-Click=Toggle, 2-Clicks=Secondary+Scene Jump, Wheel=Brightness."
  domain: automation
  input:
    wheel_device:
      name: Wheel Device
      description: Wybierz swoje kółko Zigbee2MQTT.
      selector:
        device:
          integration: mqtt
          manufacturer: "TuYa" # Helps filter the list
    main_lights:
      name: Main Lights (Wheel & 1-Click)
      selector:
        target:
          entity:
            domain: light
    secondary_target:
      name: Secondary Switch/Light (2-Clicks)
      default: {}
      selector:
        target:
          entity:
            - domain: light
            - domain: switch
    scene_1:
      name: Scene 1
      default: 
      selector:
        entity:
          domain: scene
    scene_2:
      name: Scene 2 (Optional)
      default: 
      selector:
        entity:
          domain: scene

mode: restart

trigger:
  # Trigger on ANY action from the selected device
  - platform: device
    domain: mqtt
    device_id: !input wheel_device
    type: action

action:
  - variables:
      # Extracting values from the device trigger payload
      action_state: "{{ trigger.payload }}"
      # Device triggers pass the full JSON in 'payload_json'
      lvl: "{{ trigger.payload_json.action_level | float(0) }}"

  - choose:
      # 1. WHEEL SCROLL: Brightness (0-255)
      - conditions:
          - condition: template
            value_template: "{{ action_state == 'brightness_move_to_level' }}"
        sequence:
          - service: light.turn_on
            target: !input main_lights
            data:
              brightness: "{{ lvl }}"

      # 2. SINGLE CLICK: Toggle Main
      - conditions:
          - condition: template
            value_template: "{{ action_state in ['on', 'single', 'toggle'] }}"
        sequence:
          - service: homeassistant.toggle
            target: !input main_lights

      # 3. DOUBLE CLICK: Toggle Secondary + Jump Scenes
      - conditions:
          - condition: template
            value_template: "{{ action_state in ['double', 'on_on'] }}"
        sequence:
          - service: homeassistant.toggle
            target: !input secondary_target
          - choose:
              # If Scene 1 is provided, activate it or jump to Scene 2
              - conditions:
                  - condition: template
                    value_template: "{{ scene_1 != none }}"
                sequence:
                  - service: scene.turn_on
                    target:
                      entity_id: >
                        {% if scene_2 != none and is_state(scene_1, 'on') %}
                          {{ scene_2 }}
                        {% else %}
                          {{ scene_1 }}
                        {% endif %}

      # 4. CLICK OFF: Master Kill
      - conditions:
          - condition: template
            value_template: "{{ action_state == 'off' }}"
        sequence:
          - service: homeassistant.turn_off
            target: !input main_lights
          - service: homeassistant.turn_off
            target: !input secondary_target
