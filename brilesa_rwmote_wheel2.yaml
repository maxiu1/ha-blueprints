blueprint:
  name: "Brilesa Wheel: Universal Entity Edition"
  description: "Wybierz sensor 'action' swojego kółka. 1-klik=Główne, 2-kliki=Sceny, Obrót=Jasność."
  domain: automation
  input:
    action_sensor:
      name: Wheel Action Sensor
      description: Wybierz sensor akcji (np. sensor.wheel1_action).
      selector:
        entity:
          integration: mqtt
          domain: sensor
    main_lights:
      name: Main Lights (Wheel & 1-Click)
      selector:
        target:
          entity:
            domain: light
    secondary_target:
      name: Secondary Device (Double-Click)
      default: {}
      selector:
        target:
          entity:
            - domain: light
            - domain: switch
    scene_1:
      name: Scene A
      default: 
      selector:
        entity:
          domain: scene
    scene_2:
      name: Scene B (Optional)
      default: 
      selector:
        entity:
          domain: scene

mode: restart

trigger:
  # Wyzwalamy na podstawie zmiany stanu sensora MQTT
  - platform: state
    entity_id: !input action_sensor

action:
  - variables:
      # Pobieramy akcję (on, off, double, itp.)
      action_state: "{{ trigger.to_state.state }}"
      # Pobieramy poziom jasności z atrybutów sensora
      lvl: "{{ state_attr(trigger.entity_id, 'action_level') | float(0) }}"

  - choose:
      # 1. OBRÓT: Jasność 0-255
      - conditions:
          - condition: template
            value_template: "{{ action_state == 'brightness_move_to_level' }}"
        sequence:
          - service: light.turn_on
            target: !input main_lights
            data:
              brightness: "{{ lvl }}"

      # 2. POJEDYNCZE KLIKNIĘCIE: Toggle Główne
      - conditions:
          - condition: template
            value_template: "{{ action_state in ['on', 'single', 'toggle'] }}"
        sequence:
          - service: homeassistant.toggle
            target: !input main_lights

      # 3. PODWÓJNE KLIKNIĘCIE: Toggle Secondary + Skok między scenami
      - conditions:
          - condition: template
            value_template: "{{ action_state in ['double', 'on_on'] }}"
        sequence:
          - service: homeassistant.toggle
            target: !input secondary_target
          - if:
              - condition: template
                value_template: "{{ scene_1 != none }}"
            then:
              - service: scene.turn_on
                target:
                  entity_id: >
                    {% if scene_2 != none and is_state(scene_1, 'on') %}
                      {{ scene_2 }}
                    {% else %}
                      {{ scene_1 }}
                    {% endif %}

      # 4. PRZYCISK OFF
      - conditions:
          - condition: template
            value_template: "{{ action_state == 'off' }}"
        sequence:
          - service: homeassistant.turn_off
            target: !input main_lights
          - service: homeassistant.turn_off
            target: !input secondary_target
