blueprint:
  name: "Brilesa Wheel: Sharable (Fixed Subtype Error)"
  description: "Universal Z2M Wheel using Device Picker -> MQTT Topic conversion."
  domain: automation
  input:
    wheel_device:
      name: Wheel Device
      description: Select your Zigbee2MQTT wheel.
      selector:
        device:
          integration: mqtt
    main_lights:
      name: Main Lights (Wheel & 1-Click)
      selector:
        target:
          entity:
            domain: light
    secondary_target:
      name: Secondary Device (Double-Click)
      default: {}
      selector:
        target:
          entity:
            - domain: light
            - domain: switch
    scene_1:
      name: Scene A
      default: 
      selector:
        entity:
          domain: scene
    scene_2:
      name: Scene B (Optional)
      default: 
      selector:
        entity:
          domain: scene

mode: restart

# We use the base MQTT topic of the device to avoid the 'subtype' error
trigger:
  - platform: mqtt
    topic: "zigbee2mqtt/+" # This listens to all Z2M, filtered by logic below

condition:
  # This ensures the message is actually from the device you picked in the UI
  - condition: template
    value_template: >
      {% set device_id = states.sensor | selectattr('device_id', 'eq', wheel_device) | map(attribute='entity_id') | first %}
      {% set base_topic = device_id | replace('sensor.', 'zigbee2mqtt/') | replace('_action', '') %}
      {{ trigger.topic == base_topic }}
    # Note: If your Z2M base topic is different (e.g. 'z2m/'), change it above.

action:
  - variables:
      payload: "{{ trigger.payload_json }}"
      action_state: "{{ payload.action }}"
      lvl: "{{ payload.action_level | float(0) }}"

  - choose:
      # 1. ROTATION (0-255)
      - conditions:
          - condition: template
            value_template: "{{ action_state == 'brightness_move_to_level' }}"
        sequence:
          - service: light.turn_on
            target: !input main_lights
            data:
              brightness: "{{ lvl }}"

      # 2. SINGLE CLICK (Toggle Main)
      - conditions:
          - condition: template
            value_template: "{{ action_state in ['on', 'single', 'toggle'] }}"
        sequence:
          - service: homeassistant.toggle
            target: !input main_lights

      # 3. DOUBLE CLICK (Toggle Secondary + Jump Scenes)
      - conditions:
          - condition: template
            value_template: "{{ action_state in ['double', 'on_on'] }}"
        sequence:
          - service: homeassistant.toggle
            target: !input secondary_target
          - if:
              - condition: template
                value_template: "{{ scene_1 != none }}"
            then:
              - service: scene.turn_on
                target:
                  entity_id: >
                    {% if scene_2 != none and is_state(scene_1, 'on') %}
                      {{ scene_2 }}
                    {% else %}
                      {{ scene_1 }}
                    {% endif %}

      # 4. CLICK OFF
      - conditions:
          - condition: template
            value_template: "{{ action_state == 'off' }}"
        sequence:
          - service: homeassistant.turn_off
            target: !input main_lights
          - service: homeassistant.turn_off
            target: !input secondary_target
