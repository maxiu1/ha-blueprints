blueprint:
  name: "Brilesa Wheel: Sharable Foundation"
  description: "Universal Z2M Wheel. Works with any device name."
  domain: automation
  input:
    wheel_device:
      name: Wheel Device
      description: Select your Zigbee2MQTT wheel (any name).
      selector:
        device:
          integration: mqtt
    main_lights:
      name: Main Lights (Wheel & 1-Click)
      selector:
        target:
          entity:
            domain: light
    secondary_target:
      name: Secondary Device (Double-Click)
      default: {}
      selector:
        target:
          entity:
            - domain: light
            - domain: switch
    scene_1:
      name: Scene A
      default: 
      selector:
        entity:
          domain: scene
    scene_2:
      name: Scene B (Optional)
      default: 
      selector:
        entity:
          domain: scene

mode: restart

trigger:
  # Using the 'action' type on the device level is the universal way
  - platform: device
    domain: mqtt
    device_id: !input wheel_device
    type: action

action:
  - variables:
      # This pulls the action name regardless of what the device is named
      action_state: "{{ trigger.payload }}"
      # This pulls the level (0-255) from the JSON payload
      lvl: "{{ trigger.payload_json.action_level | float(0) }}"

  - choose:
      # 1. ROTATION (0-255)
      - conditions:
          - condition: template
            value_template: "{{ action_state == 'brightness_move_to_level' }}"
        sequence:
          - service: light.turn_on
            target: !input main_lights
            data:
              brightness: "{{ lvl }}"

      # 2. SINGLE CLICK (Toggle Main)
      - conditions:
          - condition: template
            value_template: "{{ action_state in ['on', 'single', 'toggle'] }}"
        sequence:
          - service: homeassistant.toggle
            target: !input main_lights

      # 3. DOUBLE CLICK (Toggle Secondary + Jump Scenes)
      - conditions:
          - condition: template
            value_template: "{{ action_state in ['double', 'on_on'] }}"
        sequence:
          - service: homeassistant.toggle
            target: !input secondary_target
          - if:
              - condition: template
                value_template: "{{ scene_1 != none }}"
            then:
              - service: scene.turn_on
                target:
                  entity_id: >
                    {% if scene_2 != none and is_state(scene_1, 'on') %}
                      {{ scene_2 }}
                    {% else %}
                      {{ scene_1 }}
                    {% endif %}

      # 4. CLICK OFF
      - conditions:
          - condition: template
            value_template: "{{ action_state == 'off' }}"
        sequence:
          - service: homeassistant.turn_off
            target: !input main_lights
          - service: homeassistant.turn_off
            target: !input secondary_target
