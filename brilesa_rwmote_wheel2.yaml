blueprint:
  name: "Brilesa Wheel: Ground Up Foundation"
  description: "Direct MQTT control for Lights, Switches, and Automations."
  domain: automation
  input:
    topic_name:
      name: MQTT Topic
      description: The topic from Z2M (e.g., zigbee2mqtt/Wheel1).
      default: zigbee2mqtt/Wheel1
    target_entities:
      name: Lights & Switches
      description: Select the devices you want to control.
      selector:
        target:
          entity:
            - domain: light
            - domain: switch
    automation_to_trigger:
      name: Automation (Optional)
      description: Trigger this automation when clicking 'On'.
      default: []
      selector:
        entity:
          domain: automation

mode: restart

trigger:
  - platform: mqtt
    topic: !input topic_name

action:
  - variables:
      payload: "{{ trigger.payload_json }}"
      action_state: "{{ payload.action }}"
      lvl: "{{ payload.action_level | float(0) }}"

  - choose:
      # 1. ROTATION: Sync 0-255 to Brightness
      - conditions:
          - condition: template
            value_template: "{{ action_state == 'brightness_move_to_level' }}"
        sequence:
          - service: light.turn_on
            target: !input target_entities
            data:
              brightness: "{{ lvl }}"

      # 2. CLICK 'ON': Turn On Lights OR Trigger Automation
      - conditions:
          - condition: template
            value_template: "{{ action_state == 'on' }}"
        sequence:
          - service: homeassistant.turn_on
            target: !input target_entities
          - if:
              - condition: template
                value_template: "{{ automation_to_trigger != [] }}"
            then:
              - service: automation.trigger
                target:
                  entity_id: !input automation_to_trigger

      # 3. CLICK 'OFF': Kill everything
      - conditions:
          - condition: template
            value_template: "{{ action_state == 'off' }}"
        sequence:
          - service: homeassistant.turn_off
            target: !input target_entities

      # 4. SINGLE CLICK (TOGGLE): Simple Flip
      - conditions:
          - condition: template
            value_template: "{{ action_state in ['single', 'toggle'] }}"
        sequence:
          - service: homeassistant.toggle
            target: !input target_entities
