blueprint:
  name: "Brilesa Wheel: Multi-Scene Foundation"
  description: "Rotation (Brightness), On (Multiple Scenes/Auto), Off, and Toggle."
  domain: automation
  input:
    topic_name:
      name: MQTT Topic
      description: Temat z Z2M (np. zigbee2mqtt/Wheel1).
      default: zigbee2mqtt/Wheel1
    target_entities:
      name: Lights & Switches
      description: Główne urządzenia sterowane obrotem i przyciskiem.
      selector:
        target:
          entity:
            - domain: light
            - domain: switch
    scene_primary:
      name: Primary Scene (Optional)
      description: Pierwsza scena aktywowana po kliknięciu 'On'.
      default: 
      selector:
        entity:
          domain: scene
    scene_additional:
      name: Additional Scene (Optional)
      description: Dodatkowa scena aktywowana po kliknięciu 'On'.
      default: 
      selector:
        entity:
          domain: scene
    automation_to_trigger:
      name: Automation (Optional)
      description: Automatyzacja uruchamiana po kliknięciu 'On'.
      default: 
      selector:
        entity:
          domain: automation

mode: restart

trigger:
  - platform: mqtt
    topic: !input topic_name

action:
  - variables:
      payload: "{{ trigger.payload_json }}"
      action_state: "{{ payload.action }}"
      lvl: "{{ payload.action_level | float(0) }}"

  - choose:
      # 1. ROTATION: Sync 0-255 to Brightness
      - conditions:
          - condition: template
            value_template: "{{ action_state == 'brightness_move_to_level' }}"
        sequence:
          - service: light.turn_on
            target: !input target_entities
            data:
              brightness: "{{ lvl }}"

      # 2. CLICK 'ON': Lights + Both Scenes + Automation
      - conditions:
          - condition: template
            value_template: "{{ action_state == 'on' }}"
        sequence:
          # Turn on main entities
          - service: homeassistant.turn_on
            target: !input target_entities
          
          # Activate Primary Scene
          - if:
              - condition: template
                value_template: "{{ scene_primary != none }}"
            then:
              - service: scene.turn_on
                target:
                  entity_id: !input scene_primary
          
          # Activate Additional Scene (The new picker)
          - if:
              - condition: template
                value_template: "{{ scene_additional != none }}"
            then:
              - service: scene.turn_on
                target:
                  entity_id: !input scene_additional
          
          # Trigger Automation
          - if:
              - condition: template
                value_template: "{{ automation_to_trigger != none }}"
            then:
              - service: automation.trigger
                target:
                  entity_id: !input automation_to_trigger

      # 3. CLICK 'OFF': Kill everything
      - conditions:
          - condition: template
            value_template: "{{ action_state == 'off' }}"
        sequence:
          - service: homeassistant.turn_off
            target: !input target_entities

      # 4. SINGLE CLICK / TOGGLE
      - conditions:
          - condition: template
            value_template: "{{ action_state in ['single', 'toggle'] }}"
        sequence:
          - service: homeassistant.toggle
            target: !input target_entities
