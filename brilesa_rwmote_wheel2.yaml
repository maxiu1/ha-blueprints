blueprint:
  name: Z2M Wheel (Bulletproof Template)
  description: Uses raw MQTT topic to avoid 'subtype' errors.
  domain: automation
  input:
    topic_name:
      name: Z2M Topic
      description: The topic from Z2M (usually zigbee2mqtt/Wheel1).
      default: zigbee2mqtt/Wheel1
    light_target:
      name: Light (Optional)
      default: {}
      selector:
        target:
          entity:
            domain: light
    media_player:
      name: Media Player (Optional)
      default: {}
      selector:
        target:
          entity:
            domain: media_player
    temp_sensor:
      name: Temperature Sensor (Optional)
      default: 
      selector:
        entity:
          domain: sensor
          device_class: temperature

mode: restart

trigger:
  - platform: mqtt
    topic: !input topic_name

action:
  - variables:
      # Parse the JSON coming directly from the MQTT wire
      payload: "{{ trigger.payload_json }}"
      action_state: "{{ payload.action }}"
      lvl: "{{ payload.action_level | float(0) }}"
      vol: "{{ (lvl / 255) | round(2) }}"

  - choose:
      # ROTATION
      - conditions:
          - condition: template
            value_template: "{{ action_state == 'brightness_move_to_level' }}"
        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness: "{{ lvl }}"
          - service: media_player.volume_set
            target: !input media_player
            data:
              volume_level: "{{ vol }}"

      # SINGLE CLICK
      - conditions:
          - condition: template
            value_template: "{{ action_state in ['toggle', 'single', 'on'] }}"
        sequence:
          - service: homeassistant.toggle
            target: !input light_target
          - service: media_player.media_play_pause
            target: !input media_player

      # DOUBLE CLICK (Polish TTS)
      - conditions:
          - condition: template
            value_template: "{{ action_state == 'double' }}"
        sequence:
          - condition: template
            value_template: "{{ temp_sensor != none }}"
          - service: tts.google_translate_say
            target: !input media_player
            data:
              language: "pl"
              message: "Temperatura wynosi {{ states(temp_sensor) | replace('.', ',') }} stopni."
