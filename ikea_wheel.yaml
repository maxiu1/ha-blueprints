blueprint:
  name: Zigbee2MQTT Wheel Remote Light Control
  description: Control lights with a Zigbee2MQTT wheel remote (rotate, click, hold)
  domain: automation

  input:
    mqtt_topic:
      name: MQTT topic
      description: e.g. zigbee2mqtt/wheel1/action
      selector:
        text:

    target_light:
      name: Target Light
      selector:
        entity:
          domain: light

    dimming_helper:
      name: Dimming Helper (input_boolean)
      selector:
        entity:
          domain: input_boolean

    step_size:
      name: Step size (%)
      default: 10
      selector:
        number:
          min: 1
          max: 50
          step: 1

    smooth_step:
      name: Smooth dim step (%)
      default: 3
      selector:
        number:
          min: 1
          max: 20
          step: 1

mode: restart

trigger:
  - trigger: mqtt
    topic: !input mqtt_topic

variables:
  action: "{{ trigger.payload }}"
  light: !input target_light
  helper: !input dimming_helper
  step: !input step_size
  smooth: !input smooth_step

action:
  - choose:

      # CLICK → TOGGLE
      - conditions: "{{ action == 'toggle' }}"
        sequence:
          - action: light.toggle
            target:
              entity_id: "{{ light }}"

      # ROTATE RIGHT
      - conditions: "{{ action == 'rotate_right' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light }}"
            data:
              brightness_step_pct: "{{ step }}"
              transition: 0.2

      # ROTATE LEFT
      - conditions: "{{ action == 'rotate_left' }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ light }}"
            data:
              brightness_step_pct: "{{ -step }}"
              transition: 0.2

      # HOLD UP
      - conditions: "{{ action == 'brightness_move_up' }}"
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: "{{ helper }}"

          - repeat:
              while:
                - condition: state
                  entity_id: "{{ helper }}"
                  state: "on"
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: "{{ light }}"
                  data:
                    brightness_step_pct: "{{ smooth }}"
                    transition: 0.1
                - delay: 0.1

      # HOLD DOWN
      - conditions: "{{ action == 'brightness_move_down' }}"
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: "{{ helper }}"

          - repeat:
              while:
                - condition: state
                  entity_id: "{{ helper }}"
                  state: "on"
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: "{{ light }}"
                  data:
                    brightness_step_pct: "{{ -smooth }}"
                    transition: 0.1
                - delay: 0.1

      # RELEASE
      - conditions: "{{ action == 'brightness_stop' }}"
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: "{{ helper }}"