blueprint:
  name: IKEA BILRESA (E2490) Scroll & Click
  description: Use the scroll wheel for brightness and the main button for clicks.
  domain: automation
  input:
    remote:
      name: BILRESA Remote Action Sensor
      description: The 'action' entity from Zigbee2MQTT (e.g., sensor.bilresa_action)
      selector:
        entity:
          domain: sensor
    light_target:
      name: Light(s)
      description: The light(s) to control.
      selector:
        target:
          entity:
            domain: light

mode: restart
max_exceeded: silent

trigger:
  - platform: state
    entity_id: !input remote

action:
  - vars:
      action_state: "{{ trigger.to_state.state }}"
      # Extract level from the MQTT attributes if the wheel is turned
      brightness_val: "{{ state_attr(trigger.entity_id, 'action_level') | int(0) }}"

  - choose:
      # --- SINGLE PRESS (Toggle) ---
      - conditions: "{{ action_state in ['on', 'off', 'toggle'] }}"
        sequence:
          - service: light.toggle
            target: !input light_target

      # --- DOUBLE PRESS ---
      - conditions: "{{ action_state == 'on_double' }}"
        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness_pct: 100

      # --- SCROLL WHEEL (Brightness) ---
      # The E2490 sends 'brightness_move_to_level' when turned
      - conditions: "{{ action_state == 'brightness_move_to_level' }}"
        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness: "{{ brightness_val }}"
              transition: 0.2
