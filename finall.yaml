blueprint:
  name: Phone Charging → Night Light → Morning Light
  description: >
    When phone starts charging, set lights to night mode,
    wait configurable time, turn them off.
    In the morning, turn lights on and off at set times.
  domain: automation

  input:
    charging_sensor:
      name: Phone charging sensor
      selector:
        entity:
          domain: binary_sensor

    target_lights:
      name: Lights / Light group
      selector:
        target:
          entity:
            domain: light

    night_delay_minutes:
      name: Night delay before turning lights off (minutes)
      default: 20
      selector:
        number:
          min: 1
          max: 120
          step: 1
          unit_of_measurement: minutes

    night_brightness:
      name: Night brightness (%)
      default: 1
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"

    night_rgb:
      name: Night RGB color
      default: [120, 0, 0]
      selector:
        color_rgb:

    morning_on_time:
      name: Morning ON time
      selector:
        time:

    morning_off_time:
      name: Morning OFF time
      selector:
        time:

    morning_brightness:
      name: Morning brightness (%)
      default: 100
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"

    morning_kelvin:
      name: Morning color temperature (Kelvin)
      default: 2200
      selector:
        number:
          min: 2000
          max: 6500
          step: 100
          unit_of_measurement: K

mode: restart

trigger:
  - platform: state
    entity_id: !input charging_sensor
    to: "on"
    id: phone_charging

  - platform: time
    at: !input morning_on_time
    id: morning_on

  - platform: time
    at: !input morning_off_time
    id: morning_off

action:
  - choose:

      # 📱 PHONE CHARGING → NIGHT LIGHT
      - conditions:
          - condition: trigger
            id: phone_charging
        sequence:
          - service: light.turn_on
            target: !input target_lights
            data:
              brightness_pct: !input night_brightness
              rgb_color: !input night_rgb
              transition: 3

          - delay:
              minutes: !input night_delay_minutes

          - service: light.turn_off
            target: !input target_lights
            data:
              transition: 5

      # 🌅 MORNING ON
      - conditions:
          - condition: trigger
            id: morning_on
        sequence:
          - service: light.turn_on
            target: !input target_lights
            data:
              brightness_pct: !input morning_brightness
              kelvin: !input morning_kelvin
              transition: 10

      # 🌙 MORNING OFF
      - conditions:
          - condition: trigger
            id: morning_off
        sequence:
          - service: light.turn_off
            target: !input target_lights
            data:
              transition: 10