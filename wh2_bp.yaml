blueprint:
  name: IKEA BILRESA Scroll Wheel (ZHA) - Fixed
  description: Rebuilt for ZHA to handle alternating on/off click commands and rotation.
  domain: automation
  input:
    remote:
      name: IKEA BILRESA Remote
      description: Select the IKEA scroll wheel (ZHA device)
      selector:
        device:
          integration: zha
          manufacturer: IKEA of Sweden
          model: BILRESA scroll wheel
    target_light:
      name: Target Light
      description: The light to control
      selector:
        target:
          entity:
            domain: light

mode: restart

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input remote

action:
  - variables:
      command: "{{ trigger.event.data.command }}"
      level: "{{ trigger.event.data.params.level | default(0) }}"
  - choose:
      # --- CLOCKWISE ROTATION ---
      - conditions:
          - condition: template
            value_template: "{{ command == 'move_to_level' and level == 239 }}"
        sequence:
          - service: light.turn_on
            target: !input target_light
            data:
              brightness_step_pct: 10

      # --- COUNTER-CLOCKWISE ROTATION ---
      - conditions:
          - condition: template
            value_template: "{{ command == 'move_to_level' and level == 1 }}"
        sequence:
          - service: light.turn_on
            target: !input target_light
            data:
              brightness_step_pct: -10

      # --- BUTTON CLICK (Handles both ON and OFF commands) ---
      - conditions:
          - condition: template
            value_template: "{{ command == 'off' or command == 'on' }}"
        sequence:
          - service: light.toggle
            target: !input target_light
