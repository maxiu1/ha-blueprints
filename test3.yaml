blueprint:
  name: "Brilsa Wheel - Naprawa Sterowania"
  description: "Dedykowany dla Brilsa/AVATTO. Klik: Salon, Double: Krzak, Spin: Brightness"
  domain: automation
  input:
    remote_sensor:
      name: Brilsa Action Sensor
      description: "Wybierz sensor action (np. sensor.wheel1_action)"
      selector:
        entity:
          domain: sensor
    level_sensor:
      name: Brilsa Level Sensor
      description: "Wybierz sensor action_level (np. sensor.wheel1_action_level)"
      selector:
        entity:
          domain: sensor
    light_salon:
      name: Światło Salon
      selector:
        target:
          entity:
            domain: light
    switch_krzak:
      name: Switch Krzak
      selector:
        target:
          entity:
            domain: switch

mode: restart

trigger:
  # Reagujemy na każdą zmianę, nawet na tę samą wartość
  - platform: state
    entity_id: !input remote_sensor
  - platform: state
    entity_id: !input level_sensor

action:
  - choose:
      # POJEDYNCZE KLIKNIĘCIE (Brilsa często wysyła 'toggle' zamiast 'single')
      - conditions:
          - condition: template
            value_template: "{{ states(remote_sensor) in ['single', 'toggle'] }}"
        sequence:
          - service: light.toggle
            target: !input light_salon

      # PODWÓJNE KLIKNIĘCIE
      - conditions:
          - condition: template
            value_template: "{{ states(remote_sensor) == 'double' }}"
        sequence:
          - service: switch.toggle
            target: !input switch_krzak

      # OBRÓT (Jasność 0-255)
      - conditions:
          - condition: template
            value_template: "{{ trigger.entity_id == level_sensor and trigger.to_state.state not in ['unknown', 'unavailable', 'null'] }}"
        sequence:
          - service: light.turn_on
            target: !input light_salon
            data:
              brightness: "{{ trigger.to_state.state | int }}"
