blueprint:
  name: "Brilsa Wheel - Naprawiony Maping"
  description: "Działa zgodnie z mapowaniem: on/off (klik), on_double (double), brightness_move_to_level (spin)"
  domain: automation
  input:
    remote_entity:
      name: Brilsa Action Sensor
      selector:
        entity:
          domain: sensor
    light_target:
      name: Światła Salon
      selector:
        target:
          entity:
            domain: light
    switch_target:
      name: Krzak
      selector:
        target:
          entity:
            domain: switch

mode: restart

trigger:
  - platform: state
    entity_id: !input remote_entity

action:
  - variables:
      # Pobieramy stan akcji
      action: "{{ trigger.to_state.state }}"
      # Pobieramy poziom jasności z atrybutu (jeśli istnieje)
      level: "{{ state_attr(trigger.entity_id, 'action_level') }}"

  - choose:
      # 1. KLIKNIĘCIE (Zgodnie z mapą: on lub off)
      - conditions:
          - condition: template
            value_template: "{{ action in ['on', 'off', 'toggle'] }}"
        sequence:
          - service: light.toggle
            target: !input light_target

      # 2. PODWÓJNE KLIKNIĘCIE (Zgodnie z mapą: on_double lub off_double)
      - conditions:
          - condition: template
            value_template: "{{ action in ['on_double', 'off_double'] }}"
        sequence:
          - service: switch.toggle
            target: !input switch_target

      # 3. OBRÓT KOŁEM (brightness_move_to_level)
      - conditions:
          - condition: template
            value_template: "{{ action == 'brightness_move_to_level' }}"
        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness: "{{ level | int }}"
