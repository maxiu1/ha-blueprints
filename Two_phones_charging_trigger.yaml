blueprint:
  name: Phone Charging (2 phones OR) → Night Light → Morning Light
  description: >
    When either of two phones starts charging (OR), set bedroom lights to night mode,
    wait X minutes, then turn off. Also turns lights on at a morning time and off at another.
    Includes weekday / weekend / custom day selection.
  domain: automation

  input:
    charging_sensor_1:
      name: Phone 1 charging sensor
      selector:
        entity:
          domain: binary_sensor

    charging_sensor_2:
      name: Phone 2 charging sensor
      selector:
        entity:
          domain: binary_sensor

    target_lights:
      name: Lights / Light group
      selector:
        target:
          entity:
            domain: light

    ################################
    # DAY PICKER (NEW)
    ################################
    day_mode:
      name: Days of week
      description: Choose when the automation is allowed to run
      default: weekdays
      selector:
        select:
          options:
            - label: Weekdays (Mon–Fri)
              value: weekdays
            - label: Weekend (Sat–Sun)
              value: weekend
            - label: Custom
              value: custom

    custom_days:
      name: Custom days
      description: Used only when "Custom" is selected
      default:
        - mon
        - tue
        - wed
        - thu
        - fri
      selector:
        select:
          multiple: true
          options:
            - label: Monday
              value: mon
            - label: Tuesday
              value: tue
            - label: Wednesday
              value: wed
            - label: Thursday
              value: thu
            - label: Friday
              value: fri
            - label: Saturday
              value: sat
            - label: Sunday
              value: sun

    ################################
    # NIGHT SETTINGS
    ################################
    night_delay_minutes:
      name: Night delay before turning lights off (minutes)
      default: 20
      selector:
        number:
          min: 1
          max: 180
          step: 1
          unit_of_measurement: minutes

    night_brightness:
      name: Night brightness (%)
      default: 1
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"

    night_rgb:
      name: Night RGB color (dark red)
      default: [120, 0, 0]
      selector:
        color_rgb:

    ################################
    # MORNING SETTINGS
    ################################
    morning_on_time:
      name: Morning ON time
      selector:
        time:

    morning_off_time:
      name: Morning OFF time
      selector:
        time:

    morning_brightness:
      name: Morning brightness (%)
      default: 100
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"

    morning_kelvin:
      name: Morning color temperature (Kelvin)
      default: 2200
      selector:
        number:
          min: 2000
          max: 6500
          step: 100
          unit_of_measurement: K

mode: restart

################################
# VARIABLES
################################
variables:
  day_mode: !input day_mode
  custom_days: !input custom_days

  today: "{{ now().strftime('%a') | lower }}"
  allowed_today: >-
    {% if day_mode == 'weekdays' %}
      {{ today in ['mon','tue','wed','thu','fri'] }}
    {% elif day_mode == 'weekend' %}
      {{ today in ['sat','sun'] }}
    {% else %}
      {{ today in custom_days }}
    {% endif %}

################################
# TRIGGERS
################################
trigger:
  - platform: state
    entity_id: !input charging_sensor_1
    to: "on"
    id: phone_charging

  - platform: state
    entity_id: !input charging_sensor_2
    to: "on"
    id: phone_charging

  - platform: time
    at: !input morning_on_time
    id: morning_on

  - platform: time
    at: !input morning_off_time
    id: morning_off

################################
# CONDITIONS (DAY FILTER)
################################
condition:
  - condition: template
    value_template: "{{ allowed_today }}"

################################
# ACTIONS
################################
action:
  - choose:
      - conditions:
          - condition: trigger
            id: phone_charging
        sequence:
          - service: light.turn_on
            target: !input target_lights
            data:
              brightness_pct: !input night_brightness
              rgb_color: !input night_rgb
              transition: 3

          - delay:
              minutes: !input night_delay_minutes

          - service: light.turn_off
            target: !input target_lights
            data:
              transition: 5

      - conditions:
          - condition: trigger
            id: morning_on
        sequence:
          - service: light.turn_on
            target: !input target_lights
            data:
              brightness_pct: !input morning_brightness
              kelvin: !input morning_kelvin
              transition: 10

      - conditions:
          - condition: trigger
            id: morning_off
        sequence:
          - service: light.turn_off
            target: !input target_lights
            data:
              transition: 10