blueprint:
  name: Phone Wireless Charging Lights (DIM Scene Daily + Morning Scene Mon-Fri)
  description: >
    DIM: when phone starts wireless charging (every day).
    Optional second phone.
    Optional auto OFF after dim.
    Morning: scheduled ON only on Mon–Fri by default (or change to custom/everyday).
    Optional scenes for DIM and MORNING with toggles.
  domain: automation

  input:
    phone1_charging:
      name: Phone 1 – Charging sensor
      selector:
        entity:
          domain: binary_sensor

    phone1_charger_type:
      name: Phone 1 – Charger type sensor
      selector:
        entity:
          domain: sensor

    use_second_phone:
      name: Use second phone
      default: false
      selector:
        boolean: {}

    phone2_charging:
      name: Phone 2 – Charging sensor
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true

    phone2_charger_type:
      name: Phone 2 – Charger type sensor
      default: ""
      selector:
        entity:
          domain: sensor

    dim_lights:
      name: Lights to dim when charging
      selector:
        target:
          entity:
            domain: light

    enable_dim_scene:
      name: Use DIM scene (instead of brightness)
      default: true
      selector:
        boolean: {}

    dim_scene:
      name: DIM scene
      default: ""
      selector:
        entity:
          domain: scene

    dim_brightness:
      name: Dim brightness (%)
      default: 10
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    enable_auto_off:
      name: Enable auto OFF after dim
      default: false
      selector:
        boolean: {}

    auto_off_minutes:
      name: Auto OFF after dim (minutes)
      default: 10
      selector:
        number:
          min: 1
          max: 240
          unit_of_measurement: min

    # ---- Morning schedule ----
    on_time:
      name: Morning time to turn lights ON
      selector:
        time: {}

    weekday_mode:
      name: Morning days mode
      description: weekdays = Mon–Fri, custom = pick days, everyday = all days
      default: weekdays
      selector:
        select:
          options:
            - weekdays
            - custom
            - everyday

    weekdays_custom:
      name: Morning custom days (checkbox-like)
      description: Used only when weekday_mode = custom
      default:
        - monday
        - tuesday
        - wednesday
        - thursday
        - friday
      selector:
        select:
          multiple: true
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday

    on_lights:
      name: Morning lights target (used if morning scene disabled)
      selector:
        target:
          entity:
            domain: light

    enable_morning_scene:
      name: Use MORNING scene (instead of brightness)
      default: true
      selector:
        boolean: {}

    morning_scene:
      name: MORNING scene
      default: ""
      selector:
        entity:
          domain: scene

    on_brightness:
      name: Morning brightness (%)
      default: 80
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    enable_morning_alarm:
      name: Enable morning alarm lights
      default: true
      selector:
        boolean: {}

mode: restart

trigger:
  - platform: state
    entity_id: !input phone1_charging
    to: "on"
    id: phone1_charge

  - platform: state
    entity_id: !input phone2_charging
    to: "on"
    id: phone2_charge

  - platform: time
    at: !input on_time
    id: scheduled_on

variables:
  use_second_phone: !input use_second_phone
  enable_auto_off: !input enable_auto_off
  enable_morning_alarm: !input enable_morning_alarm

  enable_dim_scene: !input enable_dim_scene
  dim_scene: !input dim_scene

  enable_morning_scene: !input enable_morning_scene
  morning_scene: !input morning_scene

  weekday_mode: !input weekday_mode
  weekdays_custom: !input weekdays_custom

  phone2_charger_type: !input phone2_charger_type

action:
  - choose:

      # ───────── DIM ON WIRELESS CHARGING (EVERY DAY) ─────────
      - conditions:
          - condition: or
            conditions:
              - condition: and
                conditions:
                  - condition: trigger
                    id: phone1_charge
                  - condition: state
                    entity_id: !input phone1_charger_type
                    state: "wireless"

              - condition: and
                conditions:
                  - condition: trigger
                    id: phone2_charge
                  - condition: template
                    value_template: "{{ use_second_phone }}"
                  - condition: template
                    value_template: >
                      {{ phone2_charger_type != '' and is_state(phone2_charger_type, 'wireless') }}

        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ enable_dim_scene and dim_scene != '' }}"
                sequence:
                  - service: scene.turn_on
                    target:
                      entity_id: !input dim_scene
            default:
              - service: light.turn_on
                target: !input dim_lights
                data:
                  brightness_pct: !input dim_brightness

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ enable_auto_off }}"
                sequence:
                  - delay:
                      minutes: !input auto_off_minutes
                  - service: light.turn_off
                    target: !input dim_lights

      # ───────── MORNING SCHEDULE (MON–FRI DEFAULT) ─────────
      - conditions:
          - condition: trigger
            id: scheduled_on
          - condition: template
            value_template: "{{ enable_morning_alarm }}"
          - condition: template
            value_template: >
              {% set today = now().strftime('%A') | lower %}
              {% if weekday_mode == 'everyday' %}
                true
              {% elif weekday_mode == 'weekdays' %}
                {{ today in ['monday','tuesday','wednesday','thursday','friday'] }}
              {% else %}
                {{ today in (weekdays_custom or []) }}
              {% endif %}

        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ enable_morning_scene and morning_scene != '' }}"
                sequence:
                  - service: scene.turn_on
                    target:
                      entity_id: !input morning_scene
            default:
              - service: light.turn_on
                target: !input on_lights
                data:
                  brightness_pct: !input on_brightness