blueprint:
  name: Phone Wireless Charging Lights (DIM Daily + Morning ON/OFF Mon-Fri + Optional Scenes)
  description: >
    DIM: when phone starts wireless charging (every day).
    Optional second phone.
    Optional auto OFF after dim.
    Morning: scheduled ON/OFF with day selection (default Mon–Fri).
    Optional scenes for DIM, MORNING ON and MORNING OFF (each with toggles).
  domain: automation

  input:
    phone1_charging:
      name: Phone 1 – Charging sensor
      selector:
        entity:
          domain: binary_sensor

    phone1_charger_type:
      name: Phone 1 – Charger type sensor
      selector:
        entity:
          domain: sensor

    use_second_phone:
      name: Use second phone
      default: false
      selector:
        boolean: {}

    phone2_charging:
      name: Phone 2 – Charging sensor
      default: []
      selector:
        entity:
          domain: binary_sensor
          multiple: true

    phone2_charger_type:
      name: Phone 2 – Charger type sensor
      default: ""
      selector:
        entity:
          domain: sensor

    # ─── DIM ───
    dim_lights:
      name: Lights to dim when charging
      selector:
        target:
          entity:
            domain: light

    enable_dim_scene:
      name: Use DIM scene (instead of brightness)
      default: true
      selector:
        boolean: {}

    dim_scene:
      name: DIM scene
      default: ""
      selector:
        entity:
          domain: scene

    dim_brightness:
      name: Dim brightness (%)
      default: 10
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    enable_auto_off:
      name: Enable auto OFF after dim
      default: false
      selector:
        boolean: {}

    auto_off_minutes:
      name: Auto OFF after dim (minutes)
      default: 10
      selector:
        number:
          min: 1
          max: 240
          unit_of_measurement: min

    # ─── MORNING SCHEDULE ───
    on_time:
      name: Morning ON time
      selector:
        time: {}

    off_time:
      name: Morning OFF time
      selector:
        time: {}

    weekday_mode:
      name: Morning days mode
      description: weekdays = Mon–Fri, custom = pick days, everyday = all days
      default: weekdays
      selector:
        select:
          options:
            - weekdays
            - custom
            - everyday

    weekdays_custom:
      name: Morning custom days (checkbox-like)
      description: Used only when weekday_mode = custom
      default:
        - monday
        - tuesday
        - wednesday
        - thursday
        - friday
      selector:
        select:
          multiple: true
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday

    enable_morning_alarm:
      name: Enable morning schedule (ON/OFF)
      default: true
      selector:
        boolean: {}

    on_lights:
      name: Morning lights target (used when morning ON scene disabled)
      selector:
        target:
          entity:
            domain: light

    enable_morning_on_scene:
      name: Use MORNING ON scene (instead of brightness)
      default: true
      selector:
        boolean: {}

    morning_on_scene:
      name: MORNING ON scene
      default: ""
      selector:
        entity:
          domain: scene

    on_brightness:
      name: Morning ON brightness (%)
      default: 80
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    enable_morning_off_scene:
      name: Use MORNING OFF scene (instead of turning lights off)
      default: false
      selector:
        boolean: {}

    morning_off_scene:
      name: MORNING OFF scene
      default: ""
      selector:
        entity:
          domain: scene

    off_lights:
      name: Lights to turn OFF at off_time
      description: Usually same as ON lights; can be different.
      selector:
        target:
          entity:
            domain: light

mode: restart

trigger:
  - platform: state
    entity_id: !input phone1_charging
    to: "on"
    id: phone1_charge

  - platform: state
    entity_id: !input phone2_charging
    to: "on"
    id: phone2_charge

  - platform: time
    at: !input on_time
    id: scheduled_on

  - platform: time
    at: !input off_time
    id: scheduled_off

variables:
  use_second_phone: !input use_second_phone
  enable_auto_off: !input enable_auto_off

  enable_dim_scene: !input enable_dim_scene
  dim_scene: !input dim_scene

  weekday_mode: !input weekday_mode
  weekdays_custom: !input weekdays_custom
  enable_morning_alarm: !input enable_morning_alarm

  enable_morning_on_scene: !input enable_morning_on_scene
  morning_on_scene: !input morning_on_scene

  enable_morning_off_scene: !input enable_morning_off_scene
  morning_off_scene: !input morning_off_scene

  phone2_charger_type: !input phone2_charger_type

  is_morning_day: >
    {% set today = now().strftime('%A') | lower %}
    {% if weekday_mode == 'everyday' %}
      true
    {% elif weekday_mode == 'weekdays' %}
      {{ today in ['monday','tuesday','wednesday','thursday','friday'] }}
    {% else %}
      {{ today in (weekdays_custom or []) }}
    {% endif %}

action:
  - choose:

      # ───────── DIM ON WIRELESS CHARGING (EVERY DAY) ─────────
      - conditions:
          - condition: or
            conditions:
              - condition: and
                conditions:
                  - condition: trigger
                    id: phone1_charge
                  - condition: state
                    entity_id: !input phone1_charger_type
                    state: "wireless"

              - condition: and
                conditions:
                  - condition: trigger
                    id: phone2_charge
                  - condition: template
                    value_template: "{{ use_second_phone }}"
                  - condition: template
                    value_template: >
                      {{ phone2_charger_type != '' and is_state(phone2_charger_type, 'wireless') }}

        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ enable_dim_scene and dim_scene != '' }}"
                sequence:
                  - service: scene.turn_on
                    target:
                      entity_id: !input dim_scene
            default:
              - service: light.turn_on
                target: !input dim_lights
                data:
                  brightness_pct: !input dim_brightness

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ enable_auto_off }}"
                sequence:
                  - delay:
                      minutes: !input auto_off_minutes
                  - service: light.turn_off
                    target: !input dim_lights

      # ───────── MORNING ON (Mon–Fri default) ─────────
      - conditions:
          - condition: trigger
            id: scheduled_on
          - condition: template
            value_template: "{{ enable_morning_alarm and is_morning_day }}"

        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ enable_morning_on_scene and morning_on_scene != '' }}"
                sequence:
                  - service: scene.turn_on
                    target:
                      entity_id: !input morning_on_scene
            default:
              - service: light.turn_on
                target: !input on_lights
                data:
                  brightness_pct: !input on_brightness

      # ───────── MORNING OFF (Mon–Fri default) ─────────
      - conditions:
          - condition: trigger
            id: scheduled_off
          - condition: template
            value_template: "{{ enable_morning_alarm and is_morning_day }}"

        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ enable_morning_off_scene and morning_off_scene != '' }}"
                sequence:
                  - service: scene.turn_on
                    target:
                      entity_id: !input morning_off_scene
            default:
              - service: light.turn_off
                target: !input off_lights