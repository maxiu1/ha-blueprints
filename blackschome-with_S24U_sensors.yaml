blueprint:
  name: Phone Charging Lights (Delayed OFF + Scheduled ON)
  description: >
    1) When phone starts charging (any charger), wait X minutes then turn OFF chosen lights.
    2) At a specific time, if phone is still charging, turn ON chosen lights with chosen brightness and color.
  domain: automation

  input:
    phone_charging:
      name: Phone charging sensor (binary_sensor)
      description: Companion App "is_charging" binary_sensor for your S24 Ultra.
      selector:
        entity:
          domain: binary_sensor

    off_lights:
      name: Lights to turn OFF after delay
      selector:
        target:
          entity:
            domain: light

    off_delay_minutes:
      name: Delay before turning OFF (minutes)
      default: 10
      selector:
        number:
          min: 1
          max: 240
          unit_of_measurement: min

    on_time:
      name: Time to turn ON (only if still charging)
      selector:
        time: {}

    on_lights:
      name: Lights to turn ON at scheduled time
      selector:
        target:
          entity:
            domain: light

    on_brightness_pct:
      name: Turn ON brightness (%)
      default: 20
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    use_rgb_color:
      name: Use RGB color (otherwise uses Color Temperature)
      default: true
      selector:
        boolean: {}

    on_rgb_color:
      name: RGB color (used if "Use RGB color" = true)
      default: [255, 160, 0]
      selector:
        color_rgb: {}

    on_color_temp_kelvin:
      name: Color temperature in Kelvin (used if "Use RGB color" = false)
      default: 2200
      selector:
        number:
          min: 1500
          max: 6500
          unit_of_measurement: K

trigger:
  # 1) Start charging (ANY charger)
  - platform: state
    entity_id: !input phone_charging
    to: "on"
    id: charging_started

  # 2) Scheduled time check
  - platform: time
    at: !input on_time
    id: scheduled_on

action:
  - choose:
      # ───────── 1) Delayed OFF after charging starts ─────────
      - conditions:
          - condition: trigger
            id: charging_started
        sequence:
          # wait X minutes, but if charging stops, abort
          - wait_for_trigger:
              - platform: state
                entity_id: !input phone_charging
                to: "off"
            timeout:
              minutes: !input off_delay_minutes
            continue_on_timeout: true

          # only turn off if still charging after timeout
          - condition: state
            entity_id: !input phone_charging
            state: "on"

          - service: light.turn_off
            target: !input off_lights

      # ───────── 2) Scheduled ON if still charging ─────────
      - conditions:
          - condition: trigger
            id: scheduled_on
          - condition: state
            entity_id: !input phone_charging
            state: "on"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ use_rgb_color }}"
                sequence:
                  - service: light.turn_on
                    target: !input on_lights
                    data:
                      brightness_pct: !input on_brightness_pct
                      rgb_color: !input on_rgb_color
            default:
              - service: light.turn_on
                target: !input on_lights
                data:
                  brightness_pct: !input on_brightness_pct
                  kelvin: !input on_color_temp_kelvin

mode: restart
