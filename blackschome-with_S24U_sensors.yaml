blueprint:
  name: Phone Wireless Charging Light
  description: >
    Control lights based on Samsung Galaxy S24 Ultra wireless charging.
    Turns lights ON at defined brightness during a time window and
    turns them OFF after a delay once wireless charging is detected.
  domain: automation

  input:
    light_target:
      name: Light(s)
      selector:
        target:
          entity:
            domain: light

    brightness_pct:
      name: Turn ON brightness (%)
      default: 30
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    wireless_on_delay:
      name: Turn OFF lights after wireless charging (seconds)
      default: 300
      selector:
        number:
          min: 10
          max: 3600
          unit_of_measurement: seconds

    active_start:
      name: Active time start
      default: "18:00:00"
      selector:
        time: {}

    active_end:
      name: Active time end
      default: "23:59:00"
      selector:
        time: {}

trigger:
  # Wireless charging detected
  - platform: state
    entity_id: sensor.s24ultra_charger_type
    to: "wireless"

  # Charging stopped (optional immediate off)
  - platform: state
    entity_id: sensor.s24ultra_charger_type
    from: "wireless"

condition:
  - condition: template
    value_template: >
      {% set t = now().strftime('%H:%M:%S') %}
      {{ t >= active_start and t <= active_end }}

action:
  - choose:

      # ───── TURN ON LIGHTS (WIRELESS CHARGING) ─────
      - conditions:
          - condition: template
            value_template: >
              {{ trigger.to_state and trigger.to_state.state == 'wireless' }}
        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness_pct: !input brightness_pct

          - delay:
              seconds: !input wireless_on_delay

          - condition: state
            entity_id: sensor.s24ultra_charger_type
            state: "wireless"

          - service: light.turn_off
            target: !input light_target

    default: []

mode: restart
