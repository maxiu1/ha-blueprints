blueprint:
  name: Phone Wireless Charging Lights (Dim + Optional OFF + Morning Alarm)
  description: >
    Immediately dim lights when phone starts wireless charging.
    Supports optional second phone.
    Optional auto OFF after dim.
    Scheduled ON on selected weekdays with optional enable switch.
  domain: automation

  input:
    phone1_charging:
      name: Phone 1 – Charging sensor
      selector:
        entity:
          domain: binary_sensor

    phone1_charger_type:
      name: Phone 1 – Charger type sensor
      selector:
        entity:
          domain: sensor

    use_second_phone:
      name: Use second phone
      default: false
      selector:
        boolean: {}

    phone2_charging:
      name: Phone 2 – Charging sensor
      default: []
      selector:
        entity:
          domain: binary_sensor

    phone2_charger_type:
      name: Phone 2 – Charger type sensor
      default: []
      selector:
        entity:
          domain: sensor

    dim_lights:
      name: Lights to dim when charging
      selector:
        target:
          entity:
            domain: light

    dim_brightness:
      name: Dim brightness (%)
      default: 10
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    enable_auto_off:
      name: Enable auto OFF after dim
      default: false
      selector:
        boolean: {}

    auto_off_minutes:
      name: Auto OFF after dim (minutes)
      default: 10
      selector:
        number:
          min: 1
          max: 240
          unit_of_measurement: min

    on_time:
      name: Time to turn lights ON
      selector:
        time: {}

    weekdays:
      name: Active weekdays
      selector:
        select:
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
          multiple: true

    on_lights:
      name: Lights to turn ON
      selector:
        target:
          entity:
            domain: light

    on_brightness:
      name: ON brightness (%)
      default: 80
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    enable_morning_alarm:
      name: Enable morning alarm lights
      description: Enable/disable scheduled morning lights
      default: true
      selector:
        boolean: {}

trigger:
  # Phone 1 charging
  - platform: state
    entity_id: !input phone1_charging
    to: "on"
    id: phone1_charge

  # Phone 2 charging
  - platform: state
    entity_id: !input phone2_charging
    to: "on"
    id: phone2_charge

  # Auto OFF timer finished
  - platform: event
    event_type: timer.finished
    event_data:
      entity_id: timer.phone_wireless_dim_off
    id: auto_off_done

  # Scheduled ON
  - platform: time
    at: !input on_time
    id: scheduled_on

action:
  - choose:

      # ───────── DIM ON WIRELESS CHARGING ─────────
      - conditions:
          - condition: or
            conditions:
              - condition: and
                conditions:
                  - condition: trigger
                    id: phone1_charge
                  - condition: state
                    entity_id: !input phone1_charger_type
                    state: "wireless"

              - condition: and
                conditions:
                  - condition: template
                    value_template: "{{ use_second_phone }}"
                  - condition: trigger
                    id: phone2_charge
                  - condition: state
                    entity_id: !input phone2_charger_type
                    state: "wireless"
        sequence:
          - service: light.turn_on
            target: !input dim_lights
            data:
              brightness_pct: !input dim_brightness

          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ enable_auto_off }}"
                sequence:
                  - service: timer.start
                    target:
                      entity_id: timer.phone_wireless_dim_off
                    data:
                      duration:
                        minutes: !input auto_off_minutes

      # ───────── AUTO OFF ─────────
      - conditions:
          - condition: trigger
            id: auto_off_done
        sequence:
          - service: light.turn_off
            target: !input dim_lights

      # ───────── SCHEDULED ON (DAY + TIME + SWITCH) ─────────
      - conditions:
          - condition: trigger
            id: scheduled_on

          -