blueprint:
  name: Phone Charging Lights (Immediate Dim – FINAL FIXED)
  description: >
    Lights dim immediately when phone is charging,
    then turn OFF after a timer. Scheduled ON with color shift supported.
  domain: automation

  input:
    phone_charging_1:
      name: Phone charging sensor
      selector:
        entity:
          domain: binary_sensor

    off_timer_minutes:
      name: Turn OFF after charging (minutes)
      default: 10
      selector:
        number:
          min: 1
          max: 240
          unit_of_measurement: min

    off_lights:
      name: Lights to dim & turn OFF
      selector:
        target:
          entity:
            domain: light

    dim_pct:
      name: Dim brightness immediately (%)
      default: 10
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    dim_transition:
      name: Dim transition time (seconds)
      default: 3
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: seconds

    on_time:
      name: Time to turn ON lights
      selector:
        time: {}

    on_lights:
      name: Lights to turn ON
      selector:
        target:
          entity:
            domain: light

    start_color:
      name: Start color (ON)
      default: [255, 120, 0]
      selector:
        color_rgb: {}

    end_color:
      name: End color (ON)
      default: [255, 200, 150]
      selector:
        color_rgb: {}

    on_brightness_pct:
      name: Final ON brightness (%)
      default: 30
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    color_shift_seconds:
      name: Color shift duration (seconds)
      default: 30
      selector:
        number:
          min: 1
          max: 600
          unit_of_measurement: seconds

trigger:
  - platform: state
    entity_id: !input phone_charging_1
    to: "on"
    id: charging_started

  - platform: homeassistant
    event: start
    id: ha_start

  - platform: event
    ev
